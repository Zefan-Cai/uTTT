name: CPU release checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
      - name: Check every released configuration and the generated catalog
        run: python -m tools.check_configs --check-catalog
      - name: Run CPU regression tests
        run: python -m pytest -q
      - name: Compile Python and parse launchers
        run: |
          python -m compileall -q tools tests uttt_nvs uttt_llm
          bash -n scripts/launch_common.sh
          bash -n uttt_nvs/train/launch.sh
          bash -n uttt_llm/launch/train.sh
