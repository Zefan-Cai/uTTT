exp_name: transformer_dl3dv

model:
  class_name: uttt_nvs.models.lvsm.Images2latent3D
  image_size: 256
  patch_size: 8
  act_ckpt: False
  dim: 512
  layers: 8
  block_config:
    type: uttt_nvs.models.transformer_block.MemoryModel
    params:
      attn_head_dim: 64
      inter_multi: 3
      v_gap: null
      transformer_version: "v0"
      vi_rms_norm: True
      pre_vi_source: "xi_memory_in"
      use_separate_last_to_kv: false

training:
  torch_compile: False
  # Total batch size actually used for this experiment. The trainer
  # computes batch_size_per_gpu * world_size * grad_accum_steps and
  # refuses to start if it does not match, because the GPU count comes
  # from the launcher and is invisible to this file.
  total_batch_size: 128
  grad_accum_steps: 1
  grad_clip_norm: 1.0
  may_skip_gradnorm_after: 1000
  grad_checkpoint_every: 1
  dataset_name: "uttt_nvs.data.loader.NVSDataset"
  # Data: DL3DV-10K (training split).
  # Fill in uttt_nvs/datasets.yaml once (see datasets.example.yaml); this key
  # selects the block to read. To override for a one-off run, uncomment
  # dataset_path / eval_dataset_path below.
  dataset: dl3dv
  # dataset_path: "PATH/TO/dl3dv_train_manifest.txt"
  scene_pose_normalize: True
  num_views: 12
  eval_num_views: 24
  max_range: 32
  batch_size_per_gpu: 32
  num_workers: 8
  prefetch_factor: 2
  lpips_loss_weight: 0.0
  max_fwdbwd_passes: 20000
  lr: 0.0004
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.05
  warmup: 2500
  allowed_gradnorm_factor: 5
  vis_every: 1000
  print_every: 20
  checkpoint_every: 500
  # W&B auth: copy api_keys.example.yaml to api_keys.yaml, or export WANDB_API_KEY
  api_key_path: "uttt_nvs/api_keys.yaml"
  wandb_log_every: 50
  wandb_offline: false
  wandb_resume: "allow"

# Evaluation data: DL3DV benchmark (140 test scenes).
# eval_dataset_path: "PATH/TO/dl3dv_benchmark_manifest.txt"
setup_config_path: "setup_flash.yaml"
