# uttt_dense_w2_p4_dl3dv -- uTTT-Dense with the 8 layers split into 4 depth
# partitions, each sharing one dense fast-weight state of width 2
# (fw_inter_multi 2, num_shared_pools 4); the paper's uTTT-Dense-w2-p4 row.
# The paper's run configuration with only the dataset/API-key paths rewritten.
# Total batch size 128; same 20,000-pass schedule as every small-model config.
# Training data: DL3DV (training scenes)
# Evaluation data: DL3DV benchmark (140 test scenes)
# Manifests come from uttt_nvs/datasets.yaml via `training.dataset` below.

exp_name: uttt_dense_w2_p4_dl3dv
model:
  class_name: uttt_nvs.models.lvsm.Images2latent3D
  image_size: 256
  patch_size: 8
  act_ckpt: false
  dim: 512
  layers: 8
  block_config:
    type: uttt_nvs.models.uttt_dense_partitioned.MemoryModel
    params:
      attn_head_dim: 64
      fw_head_dim: 64
      inter_multi: 3
      fw_inter_multi: 2
      num_shared_pools: 4
      pool_mode: shared
      aggregate_write: true
      l2_norm: true
      use_muon: false
      v_gap: null
training:
  torch_compile: false
  grad_accum_steps: 1
  grad_clip_norm: 1.0
  may_skip_gradnorm_after: 1000
  grad_checkpoint_every: 1
  dataset_name: uttt_nvs.data.loader.NVSDataset
  num_views: 12
  eval_num_views: 24
  batch_size_per_gpu: 32
  num_workers: 16
  prefetch_factor: 4
  lpips_loss_weight: 0.0
  max_fwdbwd_passes: 20000
  lr: 0.0004
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.05
  warmup: 2500
  allowed_gradnorm_factor: 5
  vis_every: 1000
  print_every: 20
  checkpoint_every: 500
  api_key_path: uttt_nvs/api_keys.yaml
  wandb_log_every: 50
  wandb_offline: false
  dataset: dl3dv
  total_batch_size: 128
