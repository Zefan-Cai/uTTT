# deltanet_dl3dv -- the paper's DeltaNet novel-view reference: the LaCT backbone
# with the fast-weight sublayer replaced by a delta-rule linear-attention
# mixer (8 heads x 64), no short conv, MLP width 1584 so the parameter count
# matches the fast-weight models. The paper's run configuration with only the
# dataset/API-key paths rewritten. Total batch size 128 (16 per GPU on 8 GPUs); same 20,000-pass
# schedule as every small-model config.
# Training data: DL3DV (training scenes)
# Evaluation data: DL3DV benchmark (140 test scenes)
# Manifests come from uttt_nvs/datasets.yaml via `training.dataset` below.

exp_name: deltanet_dl3dv
model:
  class_name: uttt_nvs.models.lvsm.Images2latent3D
  image_size: 256
  patch_size: 8
  act_ckpt: false
  dim: 512
  layers: 8
  block_config:
    type: uttt_nvs.models.deltanet_block.MemoryModel
    params:
      attn_head_dim: 64
      inter_multi: 3.09375
      v_gap: null
      fw_num_heads: 8
      expand_k: 1.0
      expand_v: 1.0
      use_beta: true
      use_short_conv: false
      conv_size: 4
      conv_bias: false
      qk_activation: silu
      qk_norm: l2
      use_output_gate: false
      allow_neg_eigval: false
      noise_repeat: 1
      repeat_function: repeat
      use_muon: false
training:
  torch_compile: false
  grad_accum_steps: 1
  grad_clip_norm: 1.0
  may_skip_gradnorm_after: 1000
  grad_checkpoint_every: 1
  dataset_name: uttt_nvs.data.loader.NVSDataset
  scene_pose_normalize: true
  num_views: 12
  eval_num_views: 24
  max_range: 32
  batch_size_per_gpu: 16
  num_workers: 8
  prefetch_factor: 2
  lpips_loss_weight: 0.0
  max_fwdbwd_passes: 20000
  lr: 0.0004
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.05
  warmup: 2500
  allowed_gradnorm_factor: 5
  vis_every: 1000
  print_every: 20
  checkpoint_every: 500
  api_key_path: uttt_nvs/api_keys.yaml
  wandb_log_every: 50
  wandb_offline: false
  dataset: dl3dv
  total_batch_size: 128
